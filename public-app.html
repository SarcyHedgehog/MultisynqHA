<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Home Remote">
  <title>Home Remote</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="remote-page">
  <main class="shell">
    <header class="hero compact">
      <div>
        <p class="eyebrow">Sarcastic Hedgehog</p>
        <h1>Home Remote</h1>
        <p id="connection-detail" class="muted">Securely connect to Home Assistant.</p>
      </div>
      <div class="hero-actions">
        <a class="view-link" href="study.html">3D Study</a>
        <a class="view-link" href="study-model.html">Blender Study</a>
        <span id="connection-pill" class="status offline">Offline</span>
      </div>
    </header>

    <section id="login-panel" class="panel login-panel">
      <form id="login-form">
        <label for="password">Remote password</label>
        <div class="login-row">
          <input id="password" type="password" required autocomplete="current-password" placeholder="Password">
          <button type="submit" class="primary">Connect</button>
        </div>
        <label class="check remember-device" for="remember-device">
          <input id="remember-device" type="checkbox">
          Remember this device
        </label>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </section>

    <section id="remote-panel" hidden>
      <div class="toolbar">
        <input id="entity-search" type="search" placeholder="Search remote controls…" aria-label="Search controls">
        <button id="disconnect" class="quiet">Disconnect</button>
      </div>
      <div id="entity-groups"></div>
    </section>
  </main>
  <script src="config.js"></script>
  <script type="module" src="remote-app.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
