<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local HA Bridge</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --panel: #111827;
      --muted: #94a3b8;
      --text: #e2e8f0;
      --accent: #38bdf8;
      --line: #334155;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1e293b, var(--bg) 60%);
      color: var(--text);
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    .hero, .panel {
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
      backdrop-filter: blur(8px);
    }

    .hero {
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
    }

    h1, h2, h3, p {
      margin-top: 0;
    }

    .muted, .empty {
      color: var(--muted);
    }

    pre {
      white-space: pre-wrap;
      background: #020617;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--line);
      min-height: 140px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@multisynq/client@latest/bundled/multisynq-client.min.js"></script>
  <script src="config.js"></script>
  <script src="entity-config.js"></script>
  <script src="shared.js"></script>
</head>
<body>
  <main>
    <section class="hero">
      <h1>Local Home Assistant Bridge</h1>
      <p class="muted">Run this page on the home network. It joins one fixed Multisynq session, reads the configured entities from Home Assistant, and applies remote changes back to HA.</p>
      <p id="bridge-status">Connecting...</p>
      <p id="bridge-meta" class="muted"></p>
    </section>

    <section class="panel">
      <h2>Configured Entities</h2>
      <div id="bridge-entity-list" class="grid"></div>
    </section>

    <section class="panel" style="margin-top: 20px;">
      <h2>Bridge Log</h2>
      <pre id="bridge-log"></pre>
    </section>
  </main>

  <script>
    window.addEventListener("load", async () => {
      try {
        await window.EntitySyncApp.joinBridgeSession();
      } catch (error) {
        document.getElementById("bridge-status").textContent = error.message;
      }
    });
  </script>
</body>
</html>
